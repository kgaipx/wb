# 本地开发依赖：MySQL + Redis（前端/后端本地直接起，不在此编排）
version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: gwy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: gwy_dev_root
      MYSQL_DATABASE: gwy_platform
      MYSQL_USER: gwy
      MYSQL_PASSWORD: gwy_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gwy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
