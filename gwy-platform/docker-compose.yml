# 本地开发依赖：MySQL + Redis（前端/后端本地直接起，不在此编排）
version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: gwy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: gwy_dev_root
      MYSQL_DATABASE: gwy_platform
      MYSQL_USER: gwy
      MYSQL_PASSWORD: gwy_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gwy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端应用（开发/演示可独立 uvicorn；容器化部署走此服务）
  app:
    build: ./backend
    container_name: gwy-app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://gwy:gwy_dev_pass@mysql:3306/gwy_platform?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  mysql_data:
