# AI 公考私教平台 —— 生产 nginx 配置（HTTP→HTTPS 重定向 + TLS + 安全头）
# 部署路径：/etc/nginx/conf.d/gwy.conf
# 证书：当前为自签（/opt/gwy/ssl/）。有域名后执行：
#   certbot --nginx -d your.domain.com
# 即可替换为受信任证书，其余配置无需改动。

# HTTP：全部 301 跳转到 HTTPS
server {
    listen 80;
    server_name 49.233.171.233;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 49.233.171.233;

    ssl_certificate     /opt/gwy/ssl/gwy.crt;
    ssl_certificate_key /opt/gwy/ssl/gwy.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 安全响应头（与后端 middleware 一致，静态资源同样受保护）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/gwy/frontend/dist;
    index index.html;

    # 后端 API 反代（同源 /api，避免 CORS；透传真实客户端 IP）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # FastAPI 文档（生产可注释关闭）
    location = /docs { proxy_pass http://127.0.0.1:8000/docs; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }
    location = /redoc { proxy_pass http://127.0.0.1:8000/redoc; }

    # 前端 SPA（PWA 离线需 HTTPS，本配置已满足）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
