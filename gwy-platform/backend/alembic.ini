# Alembic config (WBS 8.1 / P3 migrations)
# The actual DB URL is injected at runtime by app.core.config.settings.DATABASE_URL
# inside alembic/env.py, which overrides sqlalchemy.url below. This is only a placeholder.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./gwy_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
